</defs>
<rect width="1200" height="675" rx="26" fill="url(#bg)"/><rect width="1200" height="675" rx="26" fill="url(#grid)"/>
<rect x="18" y="18" width="1164" height="639" rx="22" fill="none" stroke="#213753" stroke-width="2"/><rect x="18" y="18" width="6" height="639" rx="3" fill="url(#teal)"/>
<g transform="translate(42,36) scale(0.82)" fill="none" stroke="#F5C542" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11 Q8 3 16 3 H28 Q36 3 36 11 V29 H8Z"/><path d="M12 12 H32 V23 H12Z"/><path d="M8 29 V36 M36 29 V36 M13 29 V34 M31 29 V34"/><path d="M7 24 H37"/><path d="M12 11 Q22 4 32 11"/></g><text x="90" y="48" fill="#14B8A6" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" opacity="1" letter-spacing="2">SLASH COMMAND • /tldr chat time:2h</text><text x="90" y="86" fill="#F8FAFC" font-family="Cinzel, Georgia, serif" font-size="35" font-weight="750" text-anchor="start" opacity="1" letter-spacing="0.5">TLDR — CHAT</text>
<rect x="930" y="42" width="214" height="42" rx="21" fill="#0B1727" stroke="#14B8A6" stroke-width="1" opacity="1"/><text x="1037" y="69" fill="#14B8A6" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="1.05">EPHEMERAL</text><line x1="42" y1="108" x2="1152" y2="108" stroke="#29435F" stroke-width="1" opacity="1"/><rect x="42" y="128" width="1110" height="82" rx="14" fill="#0B1727" stroke="#334155" stroke-width="1" opacity="1"/><text x="62" y="154" fill="#94A3B8" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="start" opacity="1" letter-spacing="1.5">WINDOW</text><text x="62" y="187" fill="#F8FAFC" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="start" opacity="1" letter-spacing="0">2 HOURS</text><rect x="210" y="151" width="170" height="30" rx="15" fill="#0B1727" stroke="#14B8A6" stroke-width="1" opacity="1"/><text x="295.0" y="171" fill="#14B8A6" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="750" text-anchor="middle" opacity="1" letter-spacing="0.6"># sit-and-chat</text><text x="1120" y="181" fill="#14B8A6" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="end" opacity="1" letter-spacing="0">PRIVATE RECAP</text><rect x="42" y="230" width="1110" height="320" rx="16" fill="url(#panel)" stroke="#334155" stroke-width="1" opacity="1"/><text x="64" y="260" fill="#F5C542" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start" opacity="1" letter-spacing="1.8">WHAT YOU MISSED</text><circle cx="70" cy="291" r="4" fill="#14B8A6"/><text x="86" y="296" fill="#F8FAFC" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start" opacity="1" letter-spacing="0">Conversation moved from ski-season plans into a debate about whether a folding chair can be considered</text><text x="86" y="317" fill="#F8FAFC" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start" opacity="1" letter-spacing="0">“premium seating.”</text><circle cx="70" cy="369" r="4" fill="#14B8A6"/><text x="86" y="374" fill="#F8FAFC" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start" opacity="1" letter-spacing="0">NotJordan and Frenchie Vive settled on Thursday for game night; two people volunteered to bring wine.</text><circle cx="70" cy="447" r="4" fill="#14B8A6"/><text x="86" y="452" fill="#F8FAFC" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start" opacity="1" letter-spacing="0">A new member asked about server roles and was pointed to /roles. No major moderation or economy events</text><text x="86" y="473" fill="#F8FAFC" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start" opacity="1" letter-spacing="0">occurred in this chat window.</text><rect x="42" y="572" width="1110" height="48" rx="10" fill="#101A28" opacity="1"/><text x="62" y="602" fill="#94A3B8" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">Human conversation only • bot/system noise excluded • generated on demand</text><text x="1148" y="642" fill="#94A3B8" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="end" opacity="1" letter-spacing="1.4">ANGRIER JORDAN • THE CHAIRMAN</text></svg>