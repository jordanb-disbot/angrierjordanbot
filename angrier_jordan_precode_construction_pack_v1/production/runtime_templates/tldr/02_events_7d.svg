" y="567" width="1110" height="52" rx="10" fill="#101A28" opacity="1"/><text x="62" y="598" fill="#94A3B8" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">Routine transfers, shop purchases, daily claims, and low-value ledger noise are excluded.</text><text x="1148" y="642" fill="#94A3B8" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="end" opacity="1" letter-spacing="1.4">ANGRIER JORDAN • THE CHAIRMAN</text></svg>