<rect x="930" y="42" width="214" height="42" rx="21" fill="#0B1727" stroke="#8B5CF6" stroke-width="1" opacity="1"/><text x="1037" y="69" fill="#8B5CF6" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="1.05">ANSWERED</text><line x1="42" y1="108" x2="1152" y2="108" stroke="#29435F" stroke-width="1" opacity="1"/><rect x="42" y="128" width="1110" height="72" rx="14" fill="#0B1727" stroke="#334155" stroke-width="1" opacity="1"/><text x="62" y="156" fill="#94A3B8" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="start" opacity="1" letter-spacing="1.4">TARGET</text><text x="62" y="185" fill="#F8FAFC" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="start" opacity="1" letter-spacing="0">NotLock</text><text x="1120" y="179" fill="#8B5CF6" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="end" opacity="1" letter-spacing="0">TRUTH SELECTED</text><rect x="42" y="224" width="1110" height="136" rx="16" fill="#101D2D" stroke="#8B5CF6" stroke-width="1" opacity="1"/><text x="64" y="257" fill="#8B5CF6" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="850" text-anchor="start" opacity="1" letter-spacing="1.7">PROMPT</text><text x="64" y="292" fill="#F8FAFC" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">What is the most ridiculous thing you have done because you were trying to impress someone?</text><rect x="42" y="386" width="1110" height="150" rx="14" fill="url(#panel)" stroke="#334155" stroke-width="1" opacity="1"/><text x="64" y="416" fill="#14B8A6" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="start" opacity="1" letter-spacing="1.6">ANSWER</text><text x="64" y="453" fill="#F8FAFC" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="550" text-anchor="start" opacity="1" letter-spacing="0">I once drove three hours for a “casual” wine tasting and pretended the traffic did not bother me.</text><text x="1120" y="512" fill="#94A3B8" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" opacity="1" letter-spacing="0">Answered by NotLock</text><rect x="42" y="565" width="1110" height="48" rx="10" fill="#101A28" opacity="1"/><text x="64" y="594" fill="#94A3B8" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">Named response • target may Skip • Play Again starts a fresh prompt.</text><text x="1148" y="642" fill="#94A3B8" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="end" opacity="1" letter-spacing="1.4">ANGRIER JORDAN • THE CHAIRMAN</text></svg>