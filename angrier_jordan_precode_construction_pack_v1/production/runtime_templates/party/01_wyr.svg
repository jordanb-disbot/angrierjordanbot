</defs>
<rect width="1200" height="675" rx="26" fill="url(#bg)"/><rect width="1200" height="675" rx="26" fill="url(#grid)"/>
<rect x="18" y="18" width="1164" height="639" rx="22" fill="none" stroke="#213753" stroke-width="2"/><rect x="18" y="18" width="6" height="639" rx="3" fill="url(#teal)"/>
<g transform="translate(42,36) scale(0.82)" fill="none" stroke="#F5C542" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11 Q8 3 16 3 H28 Q36 3 36 11 V29 H8Z"/><path d="M12 12 H32 V23 H12Z"/><path d="M8 29 V36 M36 29 V36 M13 29 V34 M31 29 V34"/><path d="M7 24 H37"/><path d="M12 11 Q22 4 32 11"/></g><text x="90" y="48" fill="#14B8A6" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" opacity="1" letter-spacing="2">SLASH COMMAND • /wyr</text><text x="90" y="86" fill="#F8FAFC" font-family="Space Grotesk, Arial, sans-serif" font-size="35" font-weight="750" text-anchor="start" opacity="1" letter-spacing="0.5">PARTY GAME</text>
<rect x="930" y="42" width="214" height="42" rx="21" fill="#0B1727" stroke="#8B5CF6" stroke-width="1" opacity="1"/><text x="1037" y="69" fill="#8B5CF6" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="1.05">VOTING OPEN</text><line x1="42" y1="108" x2="1152" y2="108" stroke="#29435F" stroke-width="1" opacity="1"/><rect x="42" y="128" width="1110" height="80" rx="14" fill="#0B1727" stroke="#334155" stroke-width="1" opacity="1"/><text x="62" y="154" fill="#8B5CF6" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="850" text-anchor="start" opacity="1" letter-spacing="1.7">WOULD YOU RATHER</text><text x="62" y="186" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" text-anchor="start" opacity="1" letter-spacing="0">60 seconds • server-wide • one vote per member</text><text x="1120" y="181" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="end" opacity="1" letter-spacing="0">00:38</text><rect x="42" y="230" width="1110" height="86" rx="14" fill="#101D2D" stroke="#8B5CF6" stroke-width="1" opacity="1"/><text x="64" y="266" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">Would you rather only be able to sit in folding chairs forever, or never sit down again?</text><rect x="42" y="340" width="535" height="150" rx="15" fill="url(#panel)" stroke="#14B8A6" stroke-width="1" opacity="1"/><text x="64" y="374" fill="#14B8A6" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="850" text-anchor="start" opacity="1" letter-spacing="0">A</text><text x="64" y="414" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750" text-anchor="start" opacity="1" letter-spacing="0">Folding chairs forever</text><text x="64" y="453" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="550" text-anchor="start" opacity="1" letter-spacing="0">Votes hidden until close</text><rect x="617" y="340" width="535" height="150" rx="15" fill="url(#panel)" stroke="#F5C542" stroke-width="1" opacity="1"/><text x="639" y="374" fill="#F5C542" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="850" text-anchor="start" opacity="1" letter-spacing="0">B</text><text x="639" y="414" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750" text-anchor="start" opacity="1" letter-spacing="0">Never sit down again</text><text x="639" y="453" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="550" text-anchor="start" opacity="1" letter-spacing="0">Votes hidden until close</text><rect x="42" y="522" width="1110" height="66" rx="11" fill="#101A28" opacity="1"/><text x="64" y="550" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="start" opacity="1" letter-spacing="1.4">HOST EXTENSION</text><text x="64" y="576" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="650" text-anchor="start" opacity="1" letter-spacing="0">+30 Seconds available once</text><text x="1120" y="572" fill="#14B8A6" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="end" opacity="1" letter-spacing="0">Play Again appears after results close</text><text x="1148" y="642" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="end" opacity="1" letter-spacing="1.4">ANGRIER JORDAN • THE CHAIRMAN</text></svg>