<g transform="translate(42,36) scale(0.82)" fill="none" stroke="#F5C542" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11 Q8 3 16 3 H28 Q36 3 36 11 V29 H8Z"/><path d="M12 12 H32 V23 H12Z"/><path d="M8 29 V36 M36 29 V36 M13 29 V34 M31 29 V34"/><path d="M7 24 H37"/><path d="M12 11 Q22 4 32 11"/></g><text x="90" y="48" fill="#14B8A6" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" opacity="1" letter-spacing="2">SLASH COMMAND • /finishsentence</text><text x="90" y="86" fill="#F8FAFC" font-family="Cinzel, Georgia, serif" font-size="35" font-weight="750" text-anchor="start" opacity="1" letter-spacing="0.5">PARTY GAME</text>
<rect x="930" y="42" width="214" height="42" rx="21" fill="#0B1727" stroke="#14B8A6" stroke-width="1" opacity="1"/><text x="1037" y="69" fill="#14B8A6" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="1.05">VOTING</text><line x1="42" y1="108" x2="1152" y2="108" stroke="#29435F" stroke-width="1" opacity="1"/><rect x="42" y="128" width="1110" height="88" rx="14" fill="#0B1727" stroke="#334155" stroke-width="1" opacity="1"/><text x="62" y="153" fill="#14B8A6" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="850" text-anchor="start" opacity="1" letter-spacing="1.7">FINISH THE SENTENCE</text><text x="62" y="186" fill="#F8FAFC" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="start" opacity="1" letter-spacing="0">“You know the server is doomed when…”</text><text x="1120" y="181" fill="#F5C542" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="end" opacity="1" letter-spacing="0">VOTING</text><rect x="42" y="244" width="1110" height="82" rx="12" fill="url(#panel)" stroke="#334155" stroke-width="1" opacity="1"/><rect x="60" y="260" width="48" height="30" rx="15" fill="#0B1727" stroke="#14B8A6" stroke-width="1" opacity="1"/><text x="84.0" y="280" fill="#14B8A6" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="750" text-anchor="middle" opacity="1" letter-spacing="0.6">1</text><text x="126" y="275" fill="#94A3B8" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">NotJordan</text><text x="126" y="302" fill="#F8FAFC" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">someone says “quick question” at 2:00 AM.</text><rect x="42" y="338" width="1110" height="82" rx="12" fill="url(#panel)" stroke="#334155" stroke-width="1" opacity="1"/><rect x="60" y="354" width="48" height="30" rx="15" fill="#0B1727" stroke="#F5C542" stroke-width="1" opacity="1"/><text x="84.0" y="374" fill="#F5C542" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="750" text-anchor="middle" opacity="1" letter-spacing="0.6">2</text><text x="126" y="369" fill="#94A3B8" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">Frenchie Vive</text><text x="126" y="396" fill="#F8FAFC" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">the Folding Chair starts giving financial advice.</text><rect x="42" y="432" width="1110" height="82" rx="12" fill="url(#panel)" stroke="#334155" stroke-width="1" opacity="1"/><rect x="60" y="448" width="48" height="30" rx="15" fill="#0B1727" stroke="#8B5CF6" stroke-width="1" opacity="1"/><text x="84.0" y="468" fill="#8B5CF6" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="750" text-anchor="middle" opacity="1" letter-spacing="0.6">3</text><text x="126" y="463" fill="#94A3B8" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">NotLock</text><text x="126" y="490" fill="#F8FAFC" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">Angrier Jordan says “I have an idea.”</text><rect x="42" y="540" width="1110" height="72" rx="11" fill="#101A28" opacity="1"/><text x="64" y="569" fill="#94A3B8" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">Votes are hidden until close • no self-vote • tie → 30-second runoff</text><text x="1120" y="593" fill="#14B8A6" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="end" opacity="1" letter-spacing="0">Play Again → new prompt</text><text x="1148" y="642" fill="#94A3B8" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="end" opacity="1" letter-spacing="1.4">ANGRIER JORDAN • THE CHAIRMAN</text></svg>