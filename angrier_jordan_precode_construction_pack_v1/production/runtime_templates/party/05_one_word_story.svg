<rect x="930" y="42" width="214" height="42" rx="21" fill="#0B1727" stroke="#8B5CF6" stroke-width="1" opacity="1"/><text x="1037" y="69" fill="#8B5CF6" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="1.05">FINAL VOTE</text><line x1="42" y1="108" x2="1152" y2="108" stroke="#29435F" stroke-width="1" opacity="1"/><rect x="42" y="128" width="1110" height="70" rx="14" fill="#0B1727" stroke="#334155" stroke-width="1" opacity="1"/><text x="62" y="155" fill="#14B8A6" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="850" text-anchor="start" opacity="1" letter-spacing="1.6">ONE WORD STORY</text><text x="62" y="184" fill="#F8FAFC" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" opacity="1" letter-spacing="0">Target: 50 words • 50 / 50 complete</text><rect x="780" y="165" width="340" height="11" rx="5.5" fill="#07101B" stroke="#334155" stroke-width="1" opacity="1"/><rect x="780" y="165" width="340" height="11" rx="5.5" fill="#14B8A6" opacity="1"/><rect x="42" y="222" width="1110" height="164" rx="14" fill="url(#panel)" stroke="#334155" stroke-width="1" opacity="1"/><text x="64" y="252" fill="#F5C542" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="start" opacity="1" letter-spacing="1.5">FINAL STORY</text><text x="64" y="288" fill="#F8FAFC" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="550" text-anchor="start" opacity="1" letter-spacing="0">The folding chair knew too much so everyone agreed to move it into the basement until someone</text><text x="64" y="313" fill="#F8FAFC" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="550" text-anchor="start" opacity="1" letter-spacing="0">remembered the basement had been renamed executive seating and suddenly nobody wanted to be</text><text x="64" y="338" fill="#F8FAFC" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="550" text-anchor="start" opacity="1" letter-spacing="0">responsible for what happened next.</text><text x="42" y="420" fill="#8B5CF6" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="850" text-anchor="start" opacity="1" letter-spacing="1.7">FAVORITE CONTRIBUTION VOTE</text><rect x="42" y="442" width="1110" height="46" rx="9" fill="#101A28" opacity="1"/><text x="64" y="471" fill="#F8FAFC" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="650" text-anchor="start" opacity="1" letter-spacing="0">NotLock</text><text x="340" y="471" fill="#14B8A6" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="650" text-anchor="start" opacity="1" letter-spacing="0">“executive”</text><text x="1120" y="471" fill="#94A3B8" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" opacity="1" letter-spacing="0">Vote</text><rect x="42" y="496" width="1110" height="46" rx="9" fill="#101A28" opacity="1"/><text x="64" y="525" fill="#F8FAFC" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="650" text-anchor="start" opacity="1" letter-spacing="0">NotJordan</text><text x="340" y="525" fill="#14B8A6" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="650" text-anchor="start" opacity="1" letter-spacing="0">“basement”</text><text x="1120" y="525" fill="#94A3B8" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" opacity="1" letter-spacing="0">Vote</text><rect x="42" y="550" width="1110" height="46" rx="9" fill="#101A28" opacity="1"/><text x="64" y="579" fill="#F8FAFC" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="650" text-anchor="start" opacity="1" letter-spacing="0">Frenchie Vive</text><text x="340" y="579" fill="#14B8A6" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="650" text-anchor="start" opacity="1" letter-spacing="0">“responsible”</text><text x="1120" y="579" fill="#94A3B8" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" opacity="1" letter-spacing="0">Vote</text><text x="42" y="622" fill="#94A3B8" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">Winner receives One Word Story win + Party Game Win. Play Again starts a fresh story.</text><text x="1148" y="642" fill="#94A3B8" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="end" opacity="1" letter-spacing="1.4">ANGRIER JORDAN • THE CHAIRMAN</text></svg>